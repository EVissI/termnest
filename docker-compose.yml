name: termnest

x-builder: &builder
  image: termnest-builder:1
  build:
    context: ./docker
    dockerfile: Dockerfile
  working_dir: /src
  volumes:
    - .:/src
    # Linux-side caches live in named volumes so they never mix with the host's
    # Windows node_modules/target and repeated builds stay fast.
    - node_modules:/src/node_modules
    - cargo_target:/src/src-tauri/target
    - cargo_registry:/usr/local/cargo/registry
    - cargo_git:/usr/local/cargo/git
    - xwin_cache:/root/.cache/cargo-xwin

services:
  build:
    <<: *builder
    command: ["sh", "/src/docker/build.sh"]

  test:
    <<: *builder
    command: ["sh", "/src/docker/test.sh"]

volumes:
  node_modules:
  cargo_target:
  cargo_registry:
  cargo_git:
  xwin_cache:
