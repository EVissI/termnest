[package]
name = "termnest-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
russh = { version = "0.64", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
log = "0.4"
zeroize = "1"
rand = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util", "test-util"] }
